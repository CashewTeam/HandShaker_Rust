[workspace]
resolver = "2"
members = [
    "crates/handshaker-core",
    "crates/handshaker-cli",
    "crates/handshaker-application",
]

[workspace.package]
version = "0.6.1"
edition = "2024"

[workspace.dependencies]
aes = "0.8"
async-trait = "0.1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
kamadak-exif = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
md-5 = "0.10"
mdns-sd = "0.20"
prost = "0.14"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
shell-words = "1"
rustyline = "15"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
prost-build = "0.14"
protoc-bin-vendored = "3"
tempfile = "3"
